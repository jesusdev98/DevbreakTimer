<section
  class="wellness-reminder"
  [class.wellness-reminder--wellness]="wellnessMode"
  aria-label="Wellness reminder">
  <div class="wellness-reminder__content">
    <span class="wellness-reminder__label">Recovery cue</span>
    <strong>{{ reminder.title }}</strong>
    <p>{{ reminder.message }}</p>
    <div class="wellness-reminder__suggestion">
      <span>{{ reminder.suggestion.label }}</span>
      <small>{{ reminder.suggestion.durationLabel }}</small>
    </div>
  </div>
  <div class="wellness-reminder__actions">
    <button type="button" (click)="completeReminder.emit(reminder)">
      {{ reminder.actionLabel }}
    </button>
    <button type="button" (click)="nextSuggestion.emit(reminder)">
      Next
    </button>
    <button type="button" class="wellness-reminder__dismiss" (click)="dismissReminder.emit(reminder)">
      Skip
    </button>
  </div>
</section>
