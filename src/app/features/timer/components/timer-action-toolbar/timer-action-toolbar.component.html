<label class="timer-card__field">
  <span class="timer-card__label">
    {{ 'timer.duration.label' | translate }}
    <span *ngIf="durationLockMessage" class="timer-card__label-state">{{ 'common.locked' | translate }}</span>
  </span>
  <input
    class="timer-card__input"
    data-testid="duration-input"
    type="number"
    min="1"
    step="1"
    inputmode="numeric"
    [placeholder]="'timer.duration.placeholder' | translate"
    [ngModel]="durationInMinutes"
    (ngModelChange)="durationChanged.emit($event)"
    [attr.aria-describedby]="durationLockMessage ? 'duration-lock-note' : null"
    [disabled]="durationLocked" />
  <span *ngIf="durationLockMessage" id="duration-lock-note" class="timer-field-note">
    {{ durationLockMessage }}
  </span>
</label>

<div class="quick-presets" role="group" aria-label="Quick duration presets">
  <button
    *ngFor="let preset of presets"
    class="quick-presets__button"
    [attr.data-testid]="'preset-' + preset"
    type="button"
    (click)="presetSelected.emit(preset)"
    [class.quick-presets__button--active]="durationInMinutes === preset && !pomodoroEnabled"
    [attr.aria-pressed]="durationInMinutes === preset && !pomodoroEnabled"
    [disabled]="durationLocked">
    {{ preset }}m
  </button>
</div>

<div class="timer-card__actions">
  <button
    class="timer-card__button timer-card__button--primary"
    data-testid="start-button"
    [class.timer-card__button--muted]="status === 'running'"
    [class.timer-card__button--resume]="status === 'paused'"
    type="button"
    (click)="startTimer.emit()"
    [disabled]="status === 'running'">
    {{ (status === 'completed' ? 'timer.actions.restart' : 'timer.actions.start') | translate }}
  </button>

  <button
    class="timer-card__button timer-card__button--secondary"
    data-testid="pause-button"
    [class.timer-card__button--paused]="status === 'paused'"
    type="button"
    (click)="pauseTimer.emit()"
    [disabled]="status !== 'running'">
    {{ 'timer.actions.pause' | translate }}
  </button>

  <button
    class="timer-card__button timer-card__button--ghost"
    data-testid="reset-button"
    [class.timer-card__button--highlight]="status === 'completed'"
    type="button"
    (click)="resetTimer.emit()">
    {{ 'timer.actions.reset' | translate }}
  </button>
</div>
