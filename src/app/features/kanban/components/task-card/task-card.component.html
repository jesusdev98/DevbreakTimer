<article
  class="task-card"
  data-testid="task-card"
  [attr.aria-labelledby]="'task-title-' + task.id"
  [class.task-card--editing]="isEditing"
  [class.task-card--active]="isActive">
  <div class="task-card__content" *ngIf="!isEditing; else editTask">
    <span class="task-card__focus-badge" *ngIf="isActive">{{ 'kanban.task.activeFocus' | translate }}</span>
    <h4 [id]="'task-title-' + task.id">{{ task.title }}</h4>
    <p *ngIf="task.description">{{ task.description }}</p>
  </div>

  <ng-template #editTask>
    <form
      class="task-card__edit"
      (ngSubmit)="saveEdit()"
      (keydown)="handleEditKeydown($event)"
      [attr.aria-label]="'Edit task ' + task.title">
      <label>
        <span>{{ 'kanban.task.title' | translate }}</span>
        <input
          #editTitleInput
          type="text"
          name="draftTitle"
          [(ngModel)]="draftTitle"
          autocomplete="off"
          aria-keyshortcuts="Control+Enter Escape"
          required />
      </label>

      <label>
        <span>{{ 'kanban.task.description' | translate }}</span>
        <textarea name="draftDescription" [(ngModel)]="draftDescription" rows="3"></textarea>
      </label>

      <div class="task-card__actions task-card__actions--edit" role="group" aria-label="Edit actions">
        <button type="submit" [disabled]="!canSave">{{ 'common.save' | translate }}</button>
        <button type="button" (click)="cancelEdit()">{{ 'common.cancel' | translate }}</button>
      </div>
    </form>
  </ng-template>

  <div class="task-card__actions" *ngIf="!isEditing" role="group" [attr.aria-label]="'Actions for ' + task.title">
    <button type="button" *ngIf="showFocusAction && !isActive" (click)="emitAction('focus')">
      {{ 'kanban.actions.focus' | translate }}
    </button>
    <button type="button" *ngIf="showFocusAction && isActive" (click)="emitAction('clearFocus')">
      {{ 'kanban.actions.clearFocus' | translate }}
    </button>
    <button #editButton type="button" *ngIf="showEditAction" (click)="startEdit()">{{ 'common.edit' | translate }}</button>
    <button type="button" *ngIf="showRestoreAction" (click)="emitAction('restore')">{{ 'kanban.actions.restore' | translate }}</button>
    <button type="button" *ngIf="showArchiveAction" (click)="emitAction('archive')">{{ 'kanban.actions.archive' | translate }}</button>
    <button
      type="button"
      [attr.aria-label]="'kanban.actions.deleteTask' | translate: { task: task.title }"
      (click)="emitAction('delete')">
      {{ 'common.delete' | translate }}
    </button>
  </div>
</article>
