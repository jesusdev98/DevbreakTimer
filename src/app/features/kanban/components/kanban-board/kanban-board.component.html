<section
  class="kanban-board"
  [class.kanban-board--density-compact]="densityMode === 'compact'"
  [class.kanban-board--density-comfortable]="densityMode === 'comfortable'"
  [class.kanban-board--density-focus]="densityMode === 'focus'"
  [attr.aria-label]="'kanban.eyebrow' | translate">
  <div class="kanban-board__active">
    <header class="kanban-board__header">
      <p class="kanban-board__eyebrow">{{ 'kanban.eyebrow' | translate }}</p>
    </header>

    <p class="sr-only" aria-live="polite" aria-atomic="true">{{ boardAnnouncement }}</p>

    <div class="kanban-board__toolbar" role="group" [attr.aria-label]="'kanban.aria.quickTools' | translate">
      <label class="kanban-search">
        <span>{{ 'kanban.search.label' | translate }}</span>
        <input
          #taskSearchInput
          type="search"
          name="taskSearch"
          [ngModel]="taskSearch"
          (ngModelChange)="setTaskSearch($event)"
          [placeholder]="'kanban.search.placeholder' | translate"
          autocomplete="off"
          [attr.aria-keyshortcuts]="shortcutLabel('search') + ' ' + shortcutLabel('escapeModal')"
          (keydown.escape)="clearSearch()" />
      </label>

      <div class="kanban-filters" role="group" [attr.aria-label]="'kanban.aria.filters' | translate">
        <button
          *ngFor="let filter of filterOptions"
          type="button"
          class="kanban-filter-chip"
          [class.kanban-filter-chip--active]="filterState.filter === filter.id"
          [attr.aria-pressed]="filterState.filter === filter.id"
          (click)="setFilter(filter.id)">
          <span>{{ filter.labelKey | translate }}</span>
          <strong>{{ filterCount(filter.id) }}</strong>
        </button>
      </div>

      <label class="kanban-sort">
        <span>{{ 'kanban.sort.label' | translate }}</span>
        <select
          name="taskSort"
          [ngModel]="filterState.sort"
          (ngModelChange)="setSort($event)">
          <option *ngFor="let sort of sortOptions" [value]="sort.id">
            {{ sort.labelKey | translate }}
          </option>
        </select>
      </label>

      <div class="kanban-density" role="group" [attr.aria-label]="'kanban.aria.density' | translate">
        <button
          *ngFor="let density of densityOptions"
          type="button"
          class="kanban-density__button"
          [class.kanban-density__button--active]="densityMode === density.id"
          [attr.aria-pressed]="densityMode === density.id"
          (click)="setDensityMode(density.id)">
          {{ density.labelKey | translate }}
        </button>
      </div>

      <button
        type="button"
        class="kanban-toolbar-action"
        (click)="resetWorkspace()">
        {{ 'kanban.actions.resetWorkspace' | translate }}
      </button>
    </div>

    <app-task-create (createTask)="createTask($event)"></app-task-create>

    <p id="kanban-drag-instructions" class="sr-only">
      {{ 'kanban.dragInstructions' | translate }}
    </p>

    <div
      class="kanban-board__columns"
      [attr.aria-label]="'kanban.aria.columns' | translate"
      aria-describedby="kanban-drag-instructions">
      <app-kanban-column
        *ngFor="let column of columns"
        [title]="translate('kanban.columns.' + column.status)"
        [status]="column.status"
        [tasks]="tasksFor(column.status)"
        [dropListId]="dropListId(column.status)"
        [connectedDropLists]="connectedDropLists(column.status)"
        [activeTaskId]="activeTaskId()"
        [showFocusAction]="canUseFocusWorkflow()"
        [showEditAction]="!isArchivedFilter()"
        [showArchiveAction]="!isArchivedFilter()"
        [showRestoreAction]="isArchivedFilter()"
        [disableDrag]="isArchivedFilter()"
        [showQuickAdd]="!isArchivedFilter()"
        [quickAddOpen]="activeQuickAddStatus === column.status"
        [emptyStateLabel]="emptyStateLabel()"
        [emptyStateHint]="emptyStateHint()"
        (taskDropped)="handleTaskDrop({ event: $event, status: column.status })"
        (taskAction)="handleTaskAction($event)"
        (taskEdit)="updateTask($event)"
        (quickAddRequested)="openQuickAdd(column.status)"
        (quickAddCancelled)="cancelQuickAdd(column.status)"
        (quickTaskCreated)="createTask($event)">
      </app-kanban-column>
    </div>
  </div>

  <ng-container *ngIf="archivedTasks() as archivedTaskList">
    <details class="kanban-archive" *ngIf="!isArchivedFilter() && archivedTaskList.length">
      <summary>
        <span>{{ 'kanban.archive.title' | translate }}</span>
        <strong>{{ archivedTaskList.length }}</strong>
      </summary>

      <div class="kanban-archive__list">
        <app-task-card
          *ngFor="let task of archivedTaskList"
          class="task-card-host--archive"
          [task]="task"
          [showFocusAction]="false"
          [showEditAction]="false"
          [showArchiveAction]="false"
          [showRestoreAction]="true"
          (taskAction)="handleTaskAction({ task: task, action: $event })">
        </app-task-card>
      </div>
    </details>
  </ng-container>
</section>
