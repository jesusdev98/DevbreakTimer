<section
  class="kanban-column"
  [attr.data-testid]="'kanban-column-' + status"
  [attr.aria-labelledby]="'kanban-column-title-' + status">
  <header class="kanban-column__header">
    <h3 [id]="'kanban-column-title-' + status">{{ title }}</h3>
    <span
      class="kanban-column__count"
      [attr.aria-label]="'kanban.columnTaskCount' | translate: { count: tasks.length, column: title }">
      {{ tasks.length }}
    </span>
  </header>

  <div
    class="kanban-column__tasks"
    cdkDropList
    [id]="dropListId"
    role="list"
    [attr.aria-label]="'kanban.columnTasksLabel' | translate: { column: title }"
    [cdkDropListData]="tasks"
    [cdkDropListConnectedTo]="connectedDropLists"
    (cdkDropListDropped)="handleTaskDrop($event)">
    <div
      *ngFor="let task of tasks"
      class="kanban-column__task"
      role="listitem"
      [attr.data-testid]="'kanban-task-' + task.id"
      cdkDrag
      [cdkDragData]="task"
      [cdkDragDisabled]="disableDrag || isTaskEditing(task)">
      <app-task-card
        [task]="task"
        [isActive]="showFocusAction && task.id === activeTaskId"
        [showFocusAction]="showFocusAction"
        [showEditAction]="showEditAction"
        [showArchiveAction]="showArchiveAction"
        [showRestoreAction]="showRestoreAction"
        (editStarted)="markTaskEditing(task)"
        (editCancelled)="clearTaskEditing(task)"
        (taskAction)="handleTaskAction(task, $event)"
        (saveTask)="handleTaskEdit(task, $event)">
      </app-task-card>
    </div>

    <div class="kanban-column__empty" *ngIf="!tasks.length">
      <strong>{{ emptyStateLabel }}</strong>
      <span>{{ emptyStateHint }}</span>
    </div>
  </div>

  <form
    *ngIf="showQuickAdd && quickAddOpen"
    class="kanban-quick-add"
    (ngSubmit)="submitQuickTask()"
    (keydown.escape)="handleQuickAddEscape($event)"
    [attr.aria-label]="'kanban.quickAdd.formLabel' | translate: { column: title }">
    <input
      #quickAddInput
      type="text"
      name="quickAddTitle"
      [(ngModel)]="quickAddTitle"
      [placeholder]="'kanban.create.titlePlaceholder' | translate"
      autocomplete="off"
      [attr.aria-label]="'kanban.quickAdd.inputLabel' | translate: { column: title }" />
    <button type="submit" [disabled]="!quickAddTitle.trim()">{{ 'common.add' | translate }}</button>
  </form>

  <button
    #quickAddTrigger
    *ngIf="showQuickAdd && !quickAddOpen"
    type="button"
    class="kanban-column__quick-add-trigger"
    [attr.aria-label]="'kanban.quickAdd.triggerLabel' | translate: { column: title }"
    (click)="requestQuickAdd()">
    {{ 'kanban.quickAdd.trigger' | translate }}
  </button>
</section>
